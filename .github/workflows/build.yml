name: Official KernelSU-Next & SuSFS Kernel Builder [Vayu]

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. Checkout Kernel Source
        uses: actions/checkout@v4

      - name: 🚀 2. Official KernelSU-Next Integration
        run: |
          echo "===> Running Official KernelSU-Next Setup Script <==="
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: 🛡️ 3. Official SuSFS Patching (v1.5.2+ / R28)
        run: |
          echo "===> Cloning Official SuSFS Repository <==="
          git clone https://gitlab.com/1392726643/susfs4ksu.git -b kernel-4.14 susfs
          
          echo "===> Patching KernelSU-Next with SuSFS (Patch 10) <==="
          if [ -d "KernelSU-Next" ]; then
            KSU_DIR="KernelSU-Next"
          elif [ -d "KernelSU" ]; then
            KSU_DIR="KernelSU"
          else
            KSU_DIR="drivers/kernelsu"
          fi
          
          cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch $KSU_DIR/ 2>/dev/null || true
          cd $KSU_DIR
          patch -p1 < 10_enable_susfs_for_ksu.patch || echo "KSU Patch applied with warnings/manual check"
          cd ../
          
          echo "===> Patching Main Kernel Tree (Patch 50 for Linux 4.14) <==="
          cp susfs/kernel_patches/50_add_susfs_in_kernel-4.14.patch .
          patch -p1 < 50_add_susfs_in_kernel-4.14.patch || echo "Kernel Patch applied with warnings"
          
          echo "===> Copying SuSFS Header Files <==="
          cp susfs/kernel_patches/fs/susfs.c fs/
          cp susfs/kernel_patches/include/linux/susfs.h include/linux/

      - name: ⚙️ 4. Enforce Defconfig Flags (SuSFS + Kprobes + DebugFS)
        run: |
          CONFIG_TARGET="arch/arm64/configs/vendor/sm8150-perf_defconfig"
          echo "===> Appending Official SuSFS & Kprobe Flags to $CONFIG_TARGET <==="
          
          cat <<EOF >> $CONFIG_TARGET

# --- OFFICIAL KERNELSU & SUSFS CONFIGS ---
CONFIG_KSU=y
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT_RESPONSE=y
CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
CONFIG_KSU_SUSFS_SUS_KSTAT=y
CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
CONFIG_KSU_SUSFS_TRY_UMOUNT=y
CONFIG_KSU_SUSFS_SPOOF_UNAME_RELEASE=y
CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
CONFIG_KSU_SUSFS_SUS_SU=y

# --- ENGKR TRACING & KPROBES CONFIGS ---
CONFIG_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_DEBUG_FS=y
CONFIG_TRACING=y
CONFIG_FTRACE=y
EOF

      - name: 🏗️ 5. Compile Kernel via build.sh
        run: |
          echo "===> Executing Primary Build System <==="
          chmod +x build.sh
          ./build.sh

      - name: 📦 6. Package Output with AnyKernel3
        run: |
          echo "===> Preparing AnyKernel3 Packaging <==="
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          
          # البحث عن ملف الكيرنل الناتج (Image.gz-dtb أو Image.gz أو Image)
          FOUND_IMAGE=$(find out/ -type f -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" | head -n 1)
          
          if [ -z "$FOUND_IMAGE" ]; then
            echo "CRITICAL ERROR: Kernel image not found in out/ directory!"
            exit 1
          fi
          
          echo "Found Kernel Image: $FOUND_IMAGE"
          cp $FOUND_IMAGE AK3/
          
          cd AK3
          zip -r9 ../Vayu-AnymoreKSU-ENGKR-Kernel.zip * -x .git README.md

      - name: 📤 7. Upload Flashable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vayu-AnymoreKSU-ENGKR-Kernel
          path: Vayu-AnymoreKSU-ENGKR-Kernel.zip
