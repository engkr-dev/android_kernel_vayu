name: 🕵️‍♂️ Kernel Source Deep Reconnaissance

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target Kernel Repository URL (e.g., https://github.com/...)'
        required: true

jobs:
  Kernel-Autopsy:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 1. Infiltrate & Clone Target Source"
        run: |
          echo "Cloning repository for Deep Scan..."
          git clone ${{ github.event.inputs.target_repo }} target_kernel --depth=1

      - name: "🛡️ 2. SuSFS Native Integration Scan"
        run: |
          echo "======================================"
          echo "🔍 SCANNING FOR NATIVE SUSFS FILES..."
          echo "======================================"
          cd target_kernel
          if [ -f "fs/susfs.c" ] || [ -f "include/linux/susfs.h" ]; then
             echo "✅ BINGO! SuSFS is NATIVELY merged by the human maintainer!"
             ls -la fs/sus* include/linux/susfs*
          else
             echo "❌ ALERT: SuSFS files are MISSING. It requires dynamic patching."
          fi

      - name: "👁️‍🗨️ 3. Kprobes & eBPF Radar (God Mode Check)"
        run: |
          echo "======================================"
          echo "🔍 CHECKING DEBUGGING & KPROBES GATES..."
          echo "======================================"
          cd target_kernel
          CONFIG_FILE=$(find arch/arm64/configs -name "vayu_defconfig" -o -name "sm8150-perf_defconfig" | head -n 1)
          echo "Scanning configuration file: $CONFIG_FILE"
          
          echo "--- KPROBES STATUS ---"
          grep -i "CONFIG_KPROBES" $CONFIG_FILE || echo "⚠️ CONFIG_KPROBES not explicitly set."
          
          echo "--- DEBUG FS STATUS ---"
          grep -i "CONFIG_DEBUG_FS" $CONFIG_FILE || echo "⚠️ CONFIG_DEBUG_FS not explicitly set."
          
          echo "--- KERNELSU STATUS ---"
          grep -i "CONFIG_KSU" $CONFIG_FILE || echo "⚠️ CONFIG_KSU not explicitly set."

      - name: "⚙️ 4. Toolchain & Compiler Tracing"
        run: |
          echo "======================================"
          echo "🔍 ANALYZING BUILD SCRIPTS FOR CLANG..."
          echo "======================================"
          cd target_kernel
          grep -ri "clang" build.sh Makefile || echo "No compiler specified in obvious files."

      - name: "📅 5. Repository Pulse (Activity Check)"
        run: |
          echo "======================================"
          echo "🔍 LAST 5 COMMITS (DNA History)..."
          echo "======================================"
          cd target_kernel
          git log -5 --oneline
