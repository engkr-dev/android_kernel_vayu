name: PRO KernelSU-Next & SuSFS Builder [Vayu]

on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: "📥 1. Checkout Kernel Source"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

- name: "🛠️ 2. Prepare Build Environment & Dependencies"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 wget device-tree-compiler
      - name: "🚀 3. Official KernelSU-Next Integration"
        run: |
          echo "===> Running Official KSU-Next Setup <==="
          # السكربت الرسمي سيدمج نفسه في مجلد drivers/ تلقائياً
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: "🛡️ 4. SuSFS Patching (Smart Integration)"
        run: |
          echo "===> Cloning Official SuSFS Repository <==="
          git clone https://gitlab.com/1392726643/susfs4ksu.git -b kernel-4.14 susfs
          
          # السكربت يحمل السورس في هذا المجلد بالأساس
          KSU_DIR="KernelSU-Next"
          
          echo "===> Patching KSU <==="
          if [ -d "susfs/kernel_patches/KernelSU-Next" ]; then
              cp susfs/kernel_patches/KernelSU-Next/10_enable_susfs_for_ksu.patch $KSU_DIR/
          else
              cp susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch $KSU_DIR/
          fi
          
          cd $KSU_DIR
          patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true
          cd ../
          
          echo "===> Patching Main Kernel <==="
          cp susfs/kernel_patches/50_add_susfs_in_kernel-4.14.patch .
          patch -p1 --forward < 50_add_susfs_in_kernel-4.14.patch || true
          
          echo "===> Injecting SuSFS Headers <==="
          cp susfs/kernel_patches/fs/susfs.c fs/
          cp susfs/kernel_patches/include/linux/susfs.h include/linux/
          
      - name: "⚙️ 5. Defconfig Strict Enforcement (Official Specs)"
        run: |
          CONFIG_TARGET="arch/arm64/configs/vendor/sm8150-perf_defconfig"
          if [ ! -f "$CONFIG_TARGET" ]; then
             CONFIG_TARGET="arch/arm64/configs/vayu_defconfig"
          fi
          
          echo "===> Appending Flags individually to avoid YAML syntax drops <==="
          echo "CONFIG_KSU=y" >> $CONFIG_TARGET
          echo "CONFIG_KSU_KPROBE_HOOKS=y" >> $CONFIG_TARGET
          echo "CONFIG_KPROBES=y" >> $CONFIG_TARGET
          echo "CONFIG_KPROBE_EVENTS=y" >> $CONFIG_TARGET
          echo "CONFIG_DEBUG_FS=y" >> $CONFIG_TARGET
          echo "CONFIG_TRACING=y" >> $CONFIG_TARGET
          echo "CONFIG_FTRACE=y" >> $CONFIG_TARGET
          
          echo "CONFIG_KSU_SUSFS=y" >> $CONFIG_TARGET
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> $CONFIG_TARGET
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $CONFIG_TARGET
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $CONFIG_TARGET
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT_RESPONSE=y" >> $CONFIG_TARGET
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $CONFIG_TARGET
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $CONFIG_TARGET
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> $CONFIG_TARGET
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $CONFIG_TARGET
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME_RELEASE=y" >> $CONFIG_TARGET
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $CONFIG_TARGET
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $CONFIG_TARGET
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $CONFIG_TARGET
          echo "CONFIG_KSU_SUSFS_SUS_SU=y" >> $CONFIG_TARGET

      - name: "🏗️ 6. Build Kernel"
        run: |
          chmod +x build.sh
          sudo bash ./build.sh

      - name: "📦 7. AnyKernel3 Packaging"
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          FOUND_IMAGE=$(find out/ -type f -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" | head -n 1)
          cp $FOUND_IMAGE AK3/
          
          cd AK3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot/block=auto/g' anykernel.sh
          zip -r9 ../Vayu-GodMode-Kernel-ENGKR.zip * -x .git README.md

      - name: "📤 8. Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Vayu-GodMode-Kernel-ENGKR
          path: Vayu-GodMode-Kernel-ENGKR.zip
