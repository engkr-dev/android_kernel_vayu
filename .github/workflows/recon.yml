name: Advanced Deep Reconnaissance [ENGKR-PRO]

on:
  workflow_dispatch:

jobs:
  Aggressive-Scanner:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Deep Checkout (Full History & Submodules)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: "🔎 Phase 1: Deep Submodule & Injection Scan (KernelSU)"
        run: |
          echo "========================================================="
          echo "[*] INITIATING DEEP SCAN FOR KERNELSU SIGNATURES..."
          echo "========================================================="
          
          echo -e "\n>>> 1. Checking Git Submodules (.gitmodules)..."
          cat .gitmodules 2>/dev/null | grep -i "kernelsu" || echo "[-] No KernelSU submodules detected."
          
          echo -e "\n>>> 2. Scanning all Shell Scripts for Build-Time Injections..."
          find . -type f -name "*.sh" -exec grep -HniE "kernelsu|curl.*kernelsu|git clone.*kernelsu" {} + || echo "[-] No build-time injection vectors found."
          
          echo -e "\n>>> 3. Aggressive File System Search for KSU traces..."
          find . -type d -iname "*kernelsu*" || echo "[-] No directories named KernelSU found in the tree."

      - name: "🛡️ Phase 2: SuSFS Advanced Signature Detection"
        run: |
          echo "========================================================="
          echo "[*] INITIATING CORE KERNEL SCAN FOR SUSFS CLOAKING..."
          echo "========================================================="
          
          echo -e "\n>>> Scanning Core VFS (Virtual File System) and Includes for SuSFS hooks..."
          find fs/ include/ kernel/ drivers/ -type f -exec grep -Hni "susfs" {} + | head -n 25 || echo "[-] No SuSFS implementation signatures detected."

      - name: "🧠 Phase 3: Defconfig Brain Extraction (Vayu)"
        run: |
          echo "========================================================="
          echo "[*] EXTRACTING TARGET CONFIGURATIONS (VAYU_DEFCONFIG)..."
          echo "========================================================="
          
          CONFIG_FILE="arch/arm64/configs/vayu_defconfig"
          if [ -f "$CONFIG_FILE" ]; then
            echo "[+] TARGET ACQUIRED: $CONFIG_FILE"
            echo -e "\n--- Current State of Tracing & Kprobes ---"
            grep -iE "CONFIG_KPROBES|CONFIG_DEBUG_FS|CONFIG_BPF|CONFIG_FTRACE_SYSCALLS|CONFIG_TRACING" "$CONFIG_FILE" || echo "[-] Configs not explicitly defined."
          else
            echo "[!] CRITICAL: $CONFIG_FILE not found!"
          fi

      - name: "📦 Phase 4: Build Logic Analysis"
        run: |
          echo "========================================================="
          echo "[*] ANALYZING PRIMARY BUILD SCRIPT (build.sh)..."
          echo "========================================================="
          
          if [ -f "build.sh" ]; then
            echo "[+] Found build.sh. Displaying compilation arguments:"
            grep -iE "make|clang|gcc|defconfig" build.sh | head -n 15
          else
            echo "[-] build.sh not found."
          fi
